name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3'
      - name: Check Python syntax
        run: |
          python -m py_compile DEPTH/depthpy/*.py
          python -m py_compile DEPTH/depthpy/utils/*.py
          python -m py_compile DEPTH/depthpy/midas/*.py
          python -m py_compile DEPTH/depthpy/midas/backbones/*.py
          python -m py_compile DEPTH/depthpy/deprecated/*.py